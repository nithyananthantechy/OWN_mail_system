version: '3.9'

services:
  # ---- PostgreSQL ----
  postgres:
    image: postgres:16-alpine
    container_name: nitechspark-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nitechspark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_development}
      POSTGRES_DB: nitechspark_mail
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nitechspark -d nitechspark_mail']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    container_name: nitechspark-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme_redis}
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', '${REDIS_PASSWORD:-changeme_redis}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- API Backend ----
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: nitechspark-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://nitechspark:${POSTGRES_PASSWORD:-changeme_development}@postgres:5432/nitechspark_mail
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme_redis}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      COOKIE_SECRET: ${COOKIE_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-NITECHSPARK Mail}
      IMAP_HOST: ${IMAP_HOST}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_SECURE: ${IMAP_SECURE:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - attachments_data:/tmp/nitechspark-mail/attachments
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:4000/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---- Frontend ----
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: nitechspark-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3

  # ---- Mailpit (local SMTP testing - dev only) ----
  mailpit:
    image: axllent/mailpit:latest
    container_name: nitechspark-mailpit
    restart: unless-stopped
    ports:
      - '8025:8025'  # Web UI
      - '1025:1025'  # SMTP
    environment:
      MP_MAX_MESSAGES: 1000
      MP_SMTP_AUTH_ACCEPT_ANY: true
      MP_SMTP_AUTH_ALLOW_INSECURE: true
    profiles:
      - dev

volumes:
  postgres_data:
    name: nitechspark_postgres_data
  redis_data:
    name: nitechspark_redis_data
  attachments_data:
    name: nitechspark_attachments

networks:
  default:
    name: nitechspark-mail-network
